name: DOTNET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Backend/**/*.csproj

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=healthcare
          POSTGRES_USER=user
          POSTGRES_PASSWORD=password
          AUTH_AUDIENCE=http://localhost:8080
          AUTH_ISSUER=onlyDevIssuer_identityWebApi
          AUTH_SECURITY_KEY=OnlyDevSecurityKey123456789_DONT_USE_DONT_USE_DONT_USE_DONT_USE_!!!
          EOF

      - name: Check Docker
        run: docker --version

      - name: Up
        run: make up

      - name: Wait for API
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/scalar >/dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs
          exit 1

      - name: Down and clean
        if: always()
        run: make down-and-clean